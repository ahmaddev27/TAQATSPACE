<style>
  html, body, #root { height: 100%; }
  #root { isolation: isolate; }
  .pub-wrap, .pub { min-height: 100%; }
  /* boot splash */
  #boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 999; transition: opacity .35s ease; }
  #boot.hide { opacity: 0; pointer-events: none; }
  .boot-inner { display: flex; flex-direction: column; align-items: center; gap: 26px; }
  .boot-logo { height: 54px; width: auto; animation: bootFade .6s ease both; }
  .boot-bars { display: flex; align-items: flex-end; gap: 6px; height: 30px; }
  .boot-bars span { width: 7px; height: 100%; border-radius: 4px; background: var(--primary); transform-origin: bottom; animation: bootWave 1.05s ease-in-out infinite; }
  .boot-bars span:nth-child(1) { animation-delay: 0s; }
  .boot-bars span:nth-child(2) { animation-delay: .12s; }
  .boot-bars span:nth-child(3) { animation-delay: .24s; background: var(--accent); }
  .boot-bars span:nth-child(4) { animation-delay: .36s; }
  .boot-bars span:nth-child(5) { animation-delay: .48s; }
  @keyframes bootWave { 0%, 100% { transform: scaleY(.32); opacity: .45; } 50% { transform: scaleY(1); opacity: 1; } }
  @keyframes bootFade { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { .boot-bars span { animation: none; transform: scaleY(.7); } }
</style>
</head>
<body>
<div id="root"></div>
<div id="boot"><div class="boot-inner"><img class="boot-logo" src="assets/logo.png" alt="TAQAT" /><div class="boot-bars"><span></span><span></span><span></span><span></span><span></span></div></div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="env,react">
  // Robustly hide the boot splash once React has mounted (handles the
  // race where mount finishes before this script runs).
  (function(){
    var root = document.getElementById('root');
    var boot = document.getElementById('boot');
    function hide(){ if (boot) boot.classList.add('hide'); }
    function check(){ if (root && root.children.length) { hide(); return true; } return false; }
    if (!check()) {
      var obs = new MutationObserver(function(){ if (check()) obs.disconnect(); });
      obs.observe(root, { childList: true });
      var poll = setInterval(function(){ if (check()) clearInterval(poll); }, 120);
      setTimeout(function(){ clearInterval(poll); hide(); }, 5000); // hard fallback
    }
  })();
</script>
</body>
