<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Coworking space — open desks">
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf3fb"/>
      <stop offset="1" stop-color="#d3e6f4"/>
    </linearGradient>
    <linearGradient id="wall1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef4f9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#wall1)"/>
  <!-- large window with daylight -->
  <rect x="120" y="90" width="640" height="360" rx="10" fill="url(#sky1)" stroke="#cfddeb" stroke-width="6"/>
  <line x1="440" y1="90" x2="440" y2="450" stroke="#cfddeb" stroke-width="6"/>
  <line x1="120" y1="270" x2="760" y2="270" stroke="#cfddeb" stroke-width="6"/>
  <circle cx="660" cy="180" r="46" fill="#F6A91B" opacity="0.85"/>
  <!-- desks -->
  <rect x="150" y="560" width="380" height="22" rx="6" fill="#1F82C7"/>
  <rect x="180" y="582" width="14" height="120" fill="#bcd2e6"/>
  <rect x="486" y="582" width="14" height="120" fill="#bcd2e6"/>
  <rect x="640" y="560" width="380" height="22" rx="6" fill="#1F82C7"/>
  <rect x="670" y="582" width="14" height="120" fill="#bcd2e6"/>
  <rect x="976" y="582" width="14" height="120" fill="#bcd2e6"/>
  <!-- laptops -->
  <rect x="250" y="520" width="90" height="56" rx="4" fill="#34526b"/>
  <rect x="240" y="576" width="110" height="10" rx="3" fill="#26415680"/>
  <rect x="740" y="520" width="90" height="56" rx="4" fill="#34526b"/>
  <rect x="730" y="576" width="110" height="10" rx="3" fill="#26415680"/>
  <!-- plant -->
  <rect x="1050" y="600" width="70" height="100" rx="8" fill="#d9a441"/>
  <path d="M1085 600 C1060 540 1040 520 1050 470 C1075 510 1090 540 1085 600 Z" fill="#2f9e6e"/>
  <path d="M1085 600 C1110 540 1130 520 1120 470 C1095 510 1080 540 1085 600 Z" fill="#37b27d"/>
  <!-- brand mark -->
  <g opacity="0.5" transform="translate(560,720)">
    <circle cx="0" cy="0" r="9" fill="#F6A91B"/>
    <text x="20" y="6" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1F82C7">TAQAT</text>
  </g>
</svg>
