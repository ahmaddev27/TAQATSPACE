  <rect x="180" y="500" width="430" height="70" rx="26" fill="#2f93d6"/>
  <rect x="205" y="520" width="120" height="80" rx="18" fill="#5aa9dd"/>
  <rect x="345" y="520" width="120" height="80" rx="18" fill="#5aa9dd"/>
  <rect x="485" y="520" width="105" height="80" rx="18" fill="#5aa9dd"/>
  <!-- coffee table -->
  <rect x="270" y="690" width="260" height="20" rx="6" fill="#9c6b3f"/>
