name: Deploy Staging

# Fires when a PR is merged (push) to dev. Backend -> api.staging.taqat.space
# (composer + migrate run ON the cPanel server, PHP 8.3). Frontend -> Next.js
# standalone served by a Node process on :3001 behind a mod_proxy .htaccess.
# Server-side one-time setup (.env, storage, .htaccess, cron) is documented in
# DEPLOYMENT.md and is NOT performed by this workflow.

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  NODE_PORT: "3001"

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.SSH_HOST }}" ] && [ -n "${{ secrets.SSH_USER }}" ] && [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ] && [ -n "${{ vars.STAGING_API_PATH }}" ] && [ -n "${{ vars.STAGING_WEB_PATH }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deploy secrets/variables not configured — skipping. See DEPLOYMENT.md."
          fi

  deploy-backend:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Rsync backend code → server (vendor built on server)
        run: |
          rsync -az --delete \
            --exclude='.env' --exclude='.git' --exclude='.github' \
            --exclude='storage' --exclude='bootstrap/cache' \
            --exclude='vendor' --exclude='node_modules' --exclude='tests' \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519" \
            backend/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.STAGING_API_PATH }}/"
      - name: Composer + migrate + cache (on server, PHP 8.3)
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/id_ed25519 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd '${{ vars.STAGING_API_PATH }}' && \
             composer install --no-dev --optimize-autoloader --no-interaction && \
             php artisan migrate --force && \
             php artisan config:cache && php artisan route:cache && php artisan view:cache && \
             php artisan queue:restart && \
             curl -sf -m 10 -o /dev/null '${{ vars.STAGING_API_URL }}/health' && echo backend-ok"

  deploy-frontend:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match local dev (node 24 / npm 11) — npm 10 rejects the lockfile.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build standalone
        working-directory: frontend
        run: |
          npm ci
          rm -rf .next
          npm run build
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.STAGING_API_URL }}
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Validate STAGING_WEB_PATH
        run: |
          if [[ ! "${{ vars.STAGING_WEB_PATH }}" == /* ]]; then
            echo "::error::STAGING_WEB_PATH must be an absolute filesystem path (got: '${{ vars.STAGING_WEB_PATH }}'). Set it to e.g. /home/space/nodeapps/staging-frontend in GitHub -> Settings -> Variables."
            exit 1
          fi
      - name: Rsync standalone → server
        run: |
          rsync -az --delete --exclude='app.log' --mkpath \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519" \
            frontend/.next/standalone/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.STAGING_WEB_PATH }}/"
      - name: Restart Node (kill by port + start detached)
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/id_ed25519 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "fuser -k ${{ env.NODE_PORT }}/tcp 2>/dev/null || true; sleep 2; \
             cd '${{ vars.STAGING_WEB_PATH }}' && \
             nohup env PORT=${{ env.NODE_PORT }} HOSTNAME=127.0.0.1 NODE_ENV=production NEXT_PUBLIC_API_URL='${{ vars.STAGING_API_URL }}' node server.js > app.log 2>&1 & disown; \
             sleep 5; curl -sf -m 10 -o /dev/null http://127.0.0.1:${{ env.NODE_PORT }}/en && echo frontend-ok"
